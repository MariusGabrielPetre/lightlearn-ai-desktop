# Builds LightLearn AI for Windows, Linux (PC + ARM64 phones) and macOS on GitHub's computers.
# Raise "version" in package.json and push to main (or push a tag like v1.0.1); the installers appear as a GitHub Release with fixed names,
# so the links on lightlearnai.com (/download/...) always point to the newest version.
name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage deb --x64 --arm64 --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac dmg --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Give the files fixed names
        shell: bash
        run: |
          mkdir -p out
          for f in dist/*.exe dist/*.AppImage dist/*.deb dist/*.dmg; do
            [ -e "$f" ] || continue
            case "$f" in
              *.exe) n=LightLearnAI-Windows-Setup.exe ;;
              *.dmg) n=LightLearnAI-macOS.dmg ;;
              *arm64*.AppImage|*aarch64*.AppImage) n=LightLearnAI-Linux-arm64.AppImage ;;
              *.AppImage) n=LightLearnAI-Linux-x86_64.AppImage ;;
              *arm64*.deb|*aarch64*.deb) n=LightLearnAI-Linux-arm64.deb ;;
              *.deb) n=LightLearnAI-Linux-amd64.deb ;;
            esac
            cp "$f" "out/$n"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: lightlearn-ai-${{ matrix.os }}
          path: out/*
  release:
    needs: build
    # Publish whatever was built, even if one platform (e.g. a busy macOS runner) did not finish.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: LightLearn AI ${{ steps.v.outputs.tag }}
          make_latest: true
          body: |
            Instalatoare LightLearn AI pentru calculator și telefoane cu Linux.
            Windows: LightLearnAI-Windows-Setup.exe · macOS: LightLearnAI-macOS.dmg
            Linux PC: AppImage / .deb (x86_64) · Telefoane cu Linux: AppImage / .deb (arm64)
            Descărcare ușoară: https://www.lightlearnai.com/#download
          files: out/*
