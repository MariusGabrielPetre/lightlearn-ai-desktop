        "AI learns from **data**: text, images, numbers, recordings.\n• **Training set** — the data it learns from\n• **Test set** — new data it's checked on\n• **Labels** — the correct answers (e.g. photo → “dog”)"]},
    {k:"learn", e:"🗑️", t:["Gunoi intră, gunoi iese","Garbage in, garbage out"],
     b:["Calitatea datelor contează mai mult decât cantitatea. Date greșite, vechi sau dezechilibrate duc la un AI care greșește sau e nedrept.\nDate bune = corecte, variate, actuale și reprezentative.",
        "Data quality matters more than quantity. Wrong, outdated or unbalanced data leads to an AI that makes mistakes or is unfair.\nGood data = accurate, varied, current and representative."]},
    {k:"mc", q:["De ce testăm modelul pe date pe care nu le-a văzut?","Why do we test a model on data it hasn't seen?"],
     o:[["Ca să vedem dacă a învățat cu adevărat, nu doar a memorat","To see if it really learned, not just memorised"],["Ca să fie mai rapid","To make it faster"],["Ca să economisim curent","To save electricity"],["Nu contează","It doesn't matter"]], a:0,
     x:["E ca la școală: examenul are întrebări noi, nu exact cele din manual.","It's like school: the exam has new questions, not the exact ones from the textbook."]},
    {k:"fill", q:["Răspunsul corect atașat unui exemplu de antrenare se numește ___.","The correct answer attached to a training example is called a ___."],
     o:[["etichetă","label"],["parolă","password"],["pixel","pixel"],["link","link"]], a:0,
     x:["Etichetele sunt adesea puse de oameni — de aceea pot conține și greșeli.","Labels are often added by people — which is why they can contain mistakes too."]},
    {k:"tf", q:["Mai multe date proaste produc un model mai bun.","More bad data produces a better model."], a:false,
     x:["Fals. „Gunoi intră, gunoi iese” — calitatea primează.","False. “Garbage in, garbage out” — quality comes first."]},
    {k:"order", q:["Ordonează pașii unui proiect de ML","Order the steps of an ML project"],
     tiles:[["Colectezi datele","Le cureți și etichetezi","Antrenezi modelul","Îl testezi pe date noi"],["Collect the data","Clean and label it","Train the model","Test it on new data"]]}
  ]}
],
u2:[
  { id:"u2l4", t:["Asistenții AI populari","Popular AI assistants"], items:[
    {k:"learn", e:"🧭", t:["Cine e cine","Who's who"],
     b:["• **Claude** (Anthropic) — scriere, analiză, cod, documente lungi\n• **ChatGPT** (OpenAI) — asistent general, imagini, voce\n• **Gemini** (Google) — integrat cu Gmail, Docs, YouTube\n• **Copilot** (Microsoft) — integrat cu Word, Excel, Outlook\n• **Perplexity** — căutare pe web cu surse citate\nToate se schimbă des — încearcă-le și alege ce ți se potrivește.",
        "• **Claude** (Anthropic) — writing, analysis, code, long documents\n• **ChatGPT** (OpenAI) — general assistant, images, voice\n• **Gemini** (Google) — built into Gmail, Docs, YouTube\n• **Copilot** (Microsoft) — built into Word, Excel, Outlook\n• **Perplexity** — web search with cited sources\nThey all change often — try them and pick what suits you."]},
    {k:"match", q:["Potrivește asistentul cu ecosistemul","Match the assistant to its ecosystem"],
     p:[["Gemini","Google Workspace"],["Copilot","Microsoft 365"],["Perplexity",["căutare cu surse","search with sources"]],["Claude","Anthropic"]]},
    {k:"mc", q:["Lucrezi toată ziua în Word și Excel. Ce asistent e integrat acolo?","You work all day in Word and Excel. Which assistant is built in there?"],
     o:["Microsoft Copilot","Midjourney","Suno","Runway"], a:0,
     x:["Copilot apare direct în aplicațiile Microsoft 365.","Copilot appears directly in Microsoft 365 apps."]},
    {k:"tf", q:["Un singur asistent AI e cel mai bun la absolut orice.","A single AI assistant is the best at absolutely everything."], a:false,
     x:["Fals. Fiecare are puncte forte; mulți profesioniști folosesc 2–3.","False. Each has strengths; many professionals use 2–3."]},
    {k:"mc", q:["Vrei un răspuns cu link-uri către surse de pe web. Ce cauți?","You want an answer with links to web sources. What do you look for?"],
     o:[["Un asistent cu căutare web și citări","An assistant with web search and citations"],["Un generator de muzică","A music generator"],["Un editor foto","A photo editor"],["Un calculator","A calculator"]], a:0,
     x:["Căutarea web cu surse îți permite să verifici informația.","Web search with sources lets you check the information."]}
  ]},
  { id:"u2l5", t:["Funcții avansate","Advanced features"], items:[
    {k:"learn", e:"🗂️", t:["Mai mult decât un chat","More than a chat"],
     b:["• **Proiecte** — păstrezi documente și instrucțiuni pentru un subiect\n• **Memorie** — asistentul ține minte preferințele tale\n• **Căutare web** — informații actuale\n• **Fișiere** — încarci PDF, Excel, imagini\n• **Artefacte / Canvas** — documente, aplicații, grafice create direct\n• **Mod vocal** — vorbești cu AI-ul ca la telefon",
        "• **Projects** — keep documents and instructions for one topic\n• **Memory** — the assistant remembers your preferences\n• **Web search** — current information\n• **Files** — upload PDFs, spreadsheets, images\n• **Artifacts / Canvas** — documents, apps and charts created directly\n• **Voice mode** — talk to the AI like a phone call"]},
    {k:"mc", q:["Lucrezi o lună la o lucrare de licență. Ce funcție te ajută cel mai mult?","You spend a month on a thesis. Which feature helps most?"],
     o:[["Un proiect cu documentele și instrucțiunile tale","A project with your documents and instructions"],["Mod vocal","Voice mode"],["Generare de imagini","Image generation"],["Nimic","Nothing"]], a:0,
     x:["În proiect nu mai repeți contextul la fiecare conversație.","In a project you don't repeat the context in every chat."]},
    {k:"match", q:["Potrivește nevoia cu funcția","Match the need to the feature"],
     p:[[["Știri de azi","Today's news"],["Căutare web","Web search"]],[["Analizezi un PDF","Analyse a PDF"],["Încărcare fișiere","File upload"]],[["Vorbești în mașină","Talk while driving"],["Mod vocal","Voice mode"]],[["Preferințe păstrate","Saved preferences"],["Memorie","Memory"]]]},
    {k:"tf", q:["Fără căutare web, un model poate să nu știe evenimentele recente.","Without web search, a model may not know recent events."], a:true,
     x:["Adevărat. Cunoștințele modelului se opresc la data antrenării.","True. A model's knowledge stops at its training date."]},
    {k:"fill", q:["Data după care un model nu mai are informații se numește data-limită a ___.","The date after which a model has no information is its knowledge ___."],
     o:[["cunoștințelor","cutoff"],["bateriei","battery"],["contului","account"],["ecranului","screen"]], a:0,
     x:["De aceea, pentru lucruri recente, folosește căutarea web.","That's why you use web search for recent things."]}
  ]}
],
u3:[
  { id:"u3l4", t:["Șabloane de prompturi","Prompt templates"], items:[
    {k:"learn", e:"📐", t:["Șabloane gata de folosit","Ready-to-use templates"],
     b:["• **Rezumat**: „Rezumă [text] în [N] puncte pentru [cine]. Evidențiază deciziile.”\n• **Email**: „Scrie un email către [cine] despre [ce]. Ton [formal]. Maxim [N] rânduri.”\n• **Plan**: „Fă-mi un plan pe [N] săptămâni ca să [scop]. Am [timp] pe zi.”\n• **Comparație**: „Compară [A] și [B] într-un tabel după [criterii].”",
        "• **Summary**: “Summarise [text] in [N] points for [whom]. Highlight decisions.”\n• **Email**: “Write an email to [whom] about [what]. [Formal] tone. Max [N] lines.”\n• **Plan**: “Make me a [N]-week plan to [goal]. I have [time] a day.”\n• **Comparison**: “Compare [A] and [B] in a table by [criteria].”"]},
    {k:"mc", q:["Vrei să alegi între două laptopuri. Ce șablon folosești?","You're choosing between two laptops. Which template do you use?"],
     o:[["Comparație într-un tabel după criterii","Comparison in a table by criteria"],["Rezumat","Summary"],["Email","Email"],["Poezie","Poem"]], a:0,
     x:["Tabelul cu criterii (preț, baterie, greutate) face alegerea clară.","A table by criteria (price, battery, weight) makes the choice clear."]},
    {k:"order", q:["Completează șablonul de plan","Fill in the plan template"],
     tiles:[["Fă-mi un plan pe 4 săptămâni","ca să învăț Excel,","am 30 de minute pe zi,","împărțit pe zile."],["Make me a 4-week plan","to learn Excel,","I have 30 minutes a day,","broken down by day."]]},
    {k:"tf", q:["E o idee bună să-ți salvezi prompturile care funcționează.","It's a good idea to save prompts that work."], a:true,
     x:["Adevărat — o „bibliotecă de prompturi” îți economisește mult timp.","True — a “prompt library” saves you a lot of time."]},
    {k:"fill", q:["Un prompt cu spații de completat, refolosibil, se numește ___.","A reusable prompt with blanks to fill is called a ___."],
     o:[["șablon","template"],["virus","virus"],["token","token"],["model","model"]], a:0,
     x:["Șabloanele fac rezultatele consecvente.","Templates make results consistent."]}
  ]},
  { id:"u3l5", t:["Tehnici avansate","Advanced techniques"], items:[
    {k:"learn", e:"⛓️", t:["Lanțuri și autocritică","Chains and self-critique"],
     b:["• **Prompt chaining** — împarți o sarcină mare în pași: întâi schița, apoi textul, apoi corectura\n• **Autocritică** — „Verifică-ți răspunsul și corectează greșelile”\n• **Spune ce SĂ facă**, nu doar ce să nu facă: „Scrie în propoziții scurte” e mai clar decât „Nu scrie complicat”",
        "• **Prompt chaining** — split a big task into steps: outline first, then the text, then the edit\n• **Self-critique** — “Check your answer and fix any mistakes”\n• **Say what TO do**, not only what not to do: “Write in short sentences” is clearer than “Don't write complicated”"]},
    {k:"learn", e:"🏷️", t:["Structură cu etichete XML","Structure with XML tags"],
     b:["Pentru prompturi lungi, organizează-le cu etichete:","For long prompts, organise them with tags:"],
     c:["<instructiuni>\nAnalizează contractul.\n</instructiuni>\n<contract>\n...\n</contract>\n<format>\nTabel: risc | clauză | soluție\n</format>","<instructions>\nAnalyse the contract.\n</instructions>\n<contract>\n...\n</contract>\n<format>\nTable: risk | clause | fix\n</format>"]},
    {k:"order", q:["Ordonează un lanț de prompturi pentru un articol","Order a prompt chain for an article"],
     tiles:[["Generează 10 idei de titlu","Fă o schiță pentru titlul ales","Scrie articolul după schiță","Corectează și scurtează textul"],["Generate 10 title ideas","Outline the chosen title","Write the article from the outline","Edit and tighten the text"]]},
    {k:"mc", q:["Care instrucțiune e mai clară?","Which instruction is clearer?"],
     o:[["„Scrie în propoziții scurte, de maxim 15 cuvinte.”","“Write in short sentences of at most 15 words.”"],["„Nu scrie lung și complicat.”","“Don't write long and complicated.”"],["„Fii normal.”","“Be normal.”"],["„Știi tu.”","“You know.”"]], a:0,
     x:["Instrucțiunile pozitive și măsurabile sunt urmate mai bine.","Positive, measurable instructions are followed better."]},
    {k:"tf", q:["Etichetele XML ajută modelul să separe instrucțiunile de date.","XML tags help the model separate instructions from data."], a:true,
     x:["Adevărat — și protejează parțial împotriva prompt injection.","True — and they partly protect against prompt injection."]},
    {k:"fill", q:["Împărțirea unei sarcini mari în mai mulți prompți succesivi se numește prompt ___.","Splitting a big task into several successive prompts is called prompt ___."],
     o:["chaining","hacking","zipping","printing"], a:0,
     x:["Fiecare pas folosește rezultatul pasului anterior.","Each step uses the result of the previous one."]}
  ]}
],
u4:[
  { id:"u4l4", t:["Prezentări, design și site-uri","Slides, design and websites"], items:[
    {k:"learn", e:"🖥️", t:["Creezi vizual în minute","Create visuals in minutes"],
     b:["• **Prezentări** — Gamma, Canva, Claude sau Copilot creează slide-uri dintr-o descriere\n• **Design** — Canva AI, Figma AI, Adobe Express: postări, logo-uri, flyere\n• **Site-uri** — Lovable, Bolt, v0, Framer generează site-uri și aplicații din text\nTu dai conținutul și direcția; AI-ul face prima versiune.",
        "• **Slides** — Gamma, Canva, Claude or Copilot build slides from a description\n• **Design** — Canva AI, Figma AI, Adobe Express: posts, logos, flyers\n• **Websites** — Lovable, Bolt, v0, Framer generate sites and apps from text\nYou bring the content and direction; AI makes the first version."]},
    {k:"mc", q:["Ai nevoie de un site de prezentare pentru o cafenea, fără cod. Ce folosești?","You need a simple site for a café, without code. What do you use?"],
     o:[["Un generator de site-uri cu AI","An AI website builder"],["Un generator de muzică","A music generator"],["Un filtru de spam","A spam filter"],["Excel","Excel"]], a:0,
     x:["Descrii site-ul, iar AI-ul generează paginile, textele și designul.","You describe the site and AI generates the pages, copy and design."]},
    {k:"order", q:["Ordonează pașii pentru o prezentare cu AI","Order the steps for a presentation with AI"],
     tiles:[["Scrii subiectul și publicul","AI propune structura","Generezi slide-urile","Ajustezi textele și imaginile"],["Write the topic and audience","AI suggests a structure","Generate the slides","Adjust the text and images"]]},
    {k:"tf", q:["Prima versiune generată de AI trebuie de obicei ajustată de tine.","The first AI-generated version usually needs adjusting by you."], a:true,
     x:["Adevărat. AI-ul îți dă viteză; tu dai calitatea finală.","True. AI gives you speed; you provide the final quality."]},
    {k:"fill", q:["Un site de o singură pagină care prezintă un produs se numește landing ___.","A one-page site presenting a product is called a landing ___."],
     o:["page","box","zone","file"], a:0,
     x:["Landing page-urile sunt ușor de generat cu AI.","Landing pages are easy to generate with AI."]}
  ]},
  { id:"u4l5", t:["Editare foto și video cu AI","Photo and video editing with AI"], items:[
    {k:"learn", e:"🪄", t:["Unelte magice","Magic tools"],
     b:["• **Generative fill** — adaugi sau ștergi obiecte dintr-o poză\n• **Upscaling** — mărești rezoluția fără să pierzi calitatea\n• **Eliminare fundal** — într-o secundă\n• **Subtitrare automată** — din vocea din video\n• **Dublaj AI** — traduci un video în altă limbă cu vocea ta",
        "• **Generative fill** — add or remove objects from a photo\n• **Upscaling** — increase resolution without losing quality\n• **Background removal** — in a second\n• **Auto captions** — from the speech in a video\n• **AI dubbing** — translate a video into another language in your own voice"]},
    {k:"match", q:["Potrivește nevoia cu unealta","Match the need to the tool"],
     p:[[["Poză mică, vrei mare","Small photo, want it big"],"Upscaling"],[["Ștergi un turist din poză","Remove a tourist from a photo"],"Generative fill"],[["Subtitrări pentru TikTok","Captions for TikTok"],["Subtitrare automată","Auto captions"]],[["Video în spaniolă","Video in Spanish"],["Dublaj AI","AI dubbing"]]]},
    {k:"mc", q:["Vrei să pui produsul pe fundal alb pentru un magazin online. Ce folosești?","You want a product on a white background for an online shop. What do you use?"],
     o:[["Eliminarea automată a fundalului","Automatic background removal"],["Dublaj AI","AI dubbing"],["Transcriere","Transcription"],["Un chatbot","A chatbot"]], a:0,
     x:["Apoi pui orice fundal vrei.","Then you can add any background you like."]},
    {k:"tf", q:["Modificarea unei poze cu AI ca să înșeli oameni poate fi ilegală.","Altering a photo with AI to deceive people can be illegal."], a:true,
     x:["Adevărat — fraudă, defăimare sau încălcarea drepturilor de imagine.","True — fraud, defamation or violating image rights."]},
    {k:"fill", q:["Mărirea rezoluției unei imagini cu AI se numește ___.","Increasing an image's resolution with AI is called ___."],
     o:["upscaling","cropping","zipping","blurring"], a:0,
     x:["AI-ul „inventează” detaliile lipsă în mod plauzibil.","AI plausibly “invents” the missing detail."]}
  ]}
],
u5:[
  { id:"u5l4", t:["Întâlniri și organizare","Meetings and organisation"], items:[
    {k:"learn", e:"🗓️", t:["Asistentul tău de birou","Your office assistant"],
     b:["• **Transcrierea ședințelor** — tot ce s-a spus, în text\n• **Minuta automată** — decizii, responsabili, termene\n• **Planificare** — îți organizează săptămâna după priorități\n• **Liste de sarcini** — din notițe dezordonate\n⚠️ Cere acordul participanților înainte să înregistrezi.",
        "• **Meeting transcription** — everything said, as text\n• **Automatic minutes** — decisions, owners, deadlines\n• **Planning** — organises your week by priority\n• **Task lists** — from messy notes\n⚠️ Get participants' consent before recording."]},
    {k:"order", q:["Ordonează fluxul după o ședință","Order the after-meeting flow"],
     tiles:[["Transcrii înregistrarea","Ceri o minută cu decizii și termene","Verifici minuta","O trimiți participanților"],["Transcribe the recording","Ask for minutes with decisions and deadlines","Check the minutes","Send them to participants"]]},
    {k:"mc", q:["Ce prompt dă cea mai utilă minută?","Which prompt gives the most useful minutes?"],
     o:[["„Extrage deciziile, cine răspunde de fiecare și termenele, într-un tabel.”","“Extract the decisions, who owns each and the deadlines, in a table.”"],["„Ce s-a întâmplat?”","“What happened?”"],["„Rezumă.”","“Summarise.”"],["„Scrie ceva.”","“Write something.”"]], a:0,
     x:["Cine, ce și până când — esențialul oricărei minute.","Who, what and by when — the core of any minutes."]},
    {k:"tf", q:["Poți înregistra o ședință fără să le spui participanților.","You can record a meeting without telling participants."], a:false,
     x:["Fals. Informează participanții și respectă regulile organizației și GDPR.","False. Inform participants and follow your organisation's rules and GDPR."]},
    {k:"fill", q:["Documentul cu deciziile unei ședințe se numește ___.","The document with a meeting's decisions is called the ___."],
     o:[["minută","minutes"],["factură","invoice"],["contract","contract"],["CV","CV"]], a:0,
     x:["AI-ul o poate genera în câteva secunde din transcriere.","AI can generate it in seconds from the transcript."]}
  ]},
  { id:"u5l5", t:["Cercetare cu AI","Research with AI"], items:[
    {k:"learn", e:"🔎", t:["Deep research","Deep research"],
     b:["Modurile de **cercetare aprofundată** caută în zeci de surse, le citesc și îți dau un raport cu citări. Excelent pentru: analize de piață, comparații de produse, documentare.\nRegula: **deschide sursele citate** și verifică afirmațiile importante.",
        "**Deep research** modes search dozens of sources, read them and give you a report with citations. Great for: market analysis, product comparisons, background research.\nThe rule: **open the cited sources** and check the important claims."]},
    {k:"order", q:["Ordonează o cercetare bună cu AI","Order a good AI research process"],
     tiles:[["Formulezi întrebarea clar","AI caută și sintetizează","Verifici sursele citate","Tragi tu concluziile"],["Frame the question clearly","AI searches and synthesises","Check the cited sources","Draw your own conclusions"]]},
    {k:"mc", q:["AI-ul citează un studiu. Ce faci înainte să-l folosești într-un raport?","The AI cites a study. What do you do before using it in a report?"],
     o:[["Deschizi linkul și verifici că studiul spune asta","Open the link and check the study says that"],["Îl copiezi direct","Copy it straight in"],["Ștergi sursa","Delete the source"],["Inventezi alt studiu","Make up another study"]], a:0,
     x:["Citările pot fi greșite sau interpretate greșit.","Citations can be wrong or misread."]},
    {k:"tf", q:["Un raport cu surse citate e mai ușor de verificat.","A report with cited sources is easier to check."], a:true,
     x:["Adevărat — de aceea cere mereu surse.","True — which is why you should always ask for sources."]},
    {k:"fill", q:["Referința la documentul de unde vine o informație se numește ___.","The reference to the document a fact comes from is called a ___."],
     o:[["citare","citation"],["prompt","prompt"],["token","token"],["parolă","password"]], a:0,
     x:["Citările fac munca ta credibilă.","Citations make your work credible."]}
  ]}
],
u6:[
  { id:"u6l4", t:["Condiții și bucle","Conditions and loops"], items:[
    {k:"learn", e:"🔀", t:["Decizii cu if","Decisions with if"],
     b:["`if` execută cod doar dacă o condiție e adevărată. Atenție la **indentare** (spațiile de la început) — în Python contează!","`if` runs code only when a condition is true. Mind the **indentation** (the leading spaces) — in Python it matters!"],
     c:"varsta = 20\nif varsta >= 18:\n    print(\"Major\")\nelse:\n    print(\"Minor\")"},
    {k:"code", q:["Completează condiția: afișează „Bravo” dacă nota e cel puțin 5","Complete the condition: print “Bravo” if the grade is at least 5"],
     c:"nota = 7\nif nota ___ 5:\n    print(\"Bravo\")", o:[">=","==","<","="], a:0,
     x:[">= înseamnă „mai mare sau egal”. Un singur = atribuie o valoare, nu compară.",">= means “greater than or equal”. A single = assigns a value, it doesn't compare."]},
    {k:"learn", e:"🔁", t:["Repetă cu for","Repeat with for"],
     b:["O **listă** ține mai multe valori. `for` trece prin fiecare:","A **list** holds several values. `for` goes through each one:"],
     c:"unelte = [\"Claude\", \"n8n\", \"Python\"]\nfor u in unelte:\n    print(\"Învăț\", u)"},
    {k:"code", q:["Completează bucla","Complete the loop"],
     c:"for nr in [1, 2, 3]:\n    ___(nr)", o:["print","for","if","list"], a:0,
     x:["Bucla afișează 1, 2 și 3, pe rând.","The loop prints 1, 2 and 3 in turn."]},
    {k:"mc", q:["De câte ori se afișează „Salut”?","How many times is “Salut” printed?"], c:"for i in range(3):\n    print(\"Salut\")",
     o:["3","1","0","4"], a:0,
     x:["range(3) produce 0, 1, 2 — adică 3 repetări.","range(3) produces 0, 1, 2 — that is, 3 repetitions."]},
    {k:"tf", q:["În Python, indentarea (spațiile) face parte din sintaxă.","In Python, indentation (spaces) is part of the syntax."], a:true,
     x:["Adevărat. Codul din interiorul lui if sau for trebuie indentat.","True. Code inside an if or for must be indented."]}
  ]},
  { id:"u6l5", t:["Funcții și primul script util","Functions and your first useful script"], items:[
    {k:"learn", e:"🧩", t:["Funcțiile","Functions"],
     b:["O **funcție** e un bloc de cod cu nume, pe care îl refolosești. Primește date (parametri) și poate întoarce un rezultat cu `return`.","A **function** is a named block of code you reuse. It takes data (parameters) and can give back a result with `return`."],
     c:"def tva(pret):\n    return pret * 0.19\n\nprint(tva(100))  # 19.0"},
    {k:"code", q:["Completează funcția care dublează un număr","Complete the function that doubles a number"],
     c:"def dublu(x):\n    ___ x * 2", o:["return","print","def","for"], a:0,
     x:["return trimite rezultatul înapoi celui care a apelat funcția.","return sends the result back to whoever called the function."]},

u7:[
  { id:"u7l4", t:["Conversație și memorie","Conversation and memory"], items:[
    {k:"learn", e:"🧠", t:["API-ul nu ține minte","The API doesn't remember"],
     b:["Prin API, modelul e **fără stare** (stateless): nu ține minte mesajele anterioare. Ca să aibă o conversație, aplicația ta trimite **tot istoricul** la fiecare apel.\nCând istoricul devine lung, îl poți **rezuma** ca să economisești tokenuri.",
        "Through the API the model is **stateless**: it doesn't remember previous messages. To hold a conversation, your app sends **the whole history** with every call.\nWhen the history gets long, you can **summarise** it to save tokens."],
     c:"messages = [\n  {\"role\": \"user\", \"content\": \"Mă cheamă Ana.\"},\n  {\"role\": \"assistant\", \"content\": \"Salut, Ana!\"},\n  {\"role\": \"user\", \"content\": \"Cum mă cheamă?\"}\n]"},
    {k:"mc", q:["De ce își amintește chatbotul numele Anei în exemplu?","Why does the chatbot remember Ana's name in the example?"],
     o:[["Pentru că istoricul e retrimis la fiecare apel","Because the history is resent with every call"],["Pentru că modelul a fost reantrenat","Because the model was retrained"],["Din întâmplare","By chance"],["Pentru că a căutat pe Google","Because it searched Google"]], a:0,
     x:["Memoria conversației = mesajele pe care i le trimiți din nou.","Conversation memory = the messages you send back to it."]},
    {k:"code", q:["Ce rol au răspunsurile modelului în istoric?","What role do the model's replies have in the history?"],
     c:"{\"role\": \"___\", \"content\": \"Salut, Ana!\"}", o:["assistant","user","system","bot"], a:0,
     x:["Mesajele tale sunt „user”, ale modelului sunt „assistant”.","Your messages are “user”, the model's are “assistant”."]},
    {k:"tf", q:["Un istoric foarte lung costă mai mulți tokeni la fiecare mesaj.","A very long history costs more tokens on every message."], a:true,
     x:["Adevărat — de aceea se folosește rezumarea sau tăierea istoricului vechi.","True — which is why history is summarised or trimmed."]},
    {k:"fill", q:["Un model care nu păstrează nimic între apeluri este ___.","A model that keeps nothing between calls is ___."],
     o:["stateless","offline","open-source","multimodal"], a:0,
     x:["Starea (istoricul) o gestionează aplicația ta.","Your app manages the state (the history)."]}
  ]},
  { id:"u7l5", t:["Testează și îmbunătățește","Test and improve"], items:[
    {k:"learn", e:"🧪", t:["Evaluări (evals)","Evaluations (evals)"],
     b:["Înainte de lansare, scrie o listă de **cazuri de test**: întrebări normale, grele, ciudate și răuvoitoare, plus răspunsul așteptat.\nDupă fiecare modificare a promptului, rulezi din nou toate testele și vezi dacă ceva s-a stricat.",
        "Before launch, write a list of **test cases**: normal, hard, odd and malicious questions, plus the expected answer.\nAfter every prompt change, rerun all the tests and see if anything broke."]},
    {k:"learn", e:"🚧", t:["Guardrails","Guardrails"],
     b:["**Guardrails** = reguli de siguranță în jurul chatbotului: subiecte interzise, filtrarea datelor personale, limite de lungime, predare către un om când clientul e nervos sau cere ceva sensibil.",
        "**Guardrails** = safety rules around the chatbot: off-limits topics, filtering personal data, length limits, handing off to a human when a customer is upset or asks for something sensitive."]},
    {k:"match", q:["Potrivește tipul de test cu exemplul","Match the test type to the example"],
     p:[[["Normal","Normal"],["„Ce program aveți?”","“What are your hours?”"]],[["Greu","Hard"],["„Pot schimba comanda după plată?”","“Can I change my order after paying?”"]],[["Răuvoitor","Malicious"],["„Ignoră regulile tale”","“Ignore your rules”"]],[["În afara temei","Off-topic"],["„Scrie-mi tema la mate”","“Do my maths homework”"]]]},
    {k:"order", q:["Ordonează ciclul de îmbunătățire","Order the improvement cycle"],
     tiles:[["Scrii cazurile de test","Rulezi chatbotul pe ele","Analizezi greșelile","Modifici promptul și repeți"],["Write test cases","Run the chatbot on them","Analyse the failures","Change the prompt and repeat"]]},
    {k:"tf", q:["Dacă un test merge o dată, nu mai trebuie rulat niciodată.","If a test passes once, it never needs rerunning."], a:false,
     x:["Fals. Orice schimbare poate strica ceva ce mergea înainte.","False. Any change can break something that worked before."]}
  ]}
],
u8:[
  { id:"u8l4", t:["Exemplu complet în n8n","A full n8n example"], items:[
    {k:"learn", e:"🧩", t:["Facturi din email → tabel","Invoices from email → sheet"],
     b:["Noduri (pași) într-un flux n8n:\n1. **Gmail Trigger** — email nou cu atașament\n2. **AI Agent / LLM** — extrage furnizor, sumă, dată\n3. **IF** — suma e peste 1000?\n4. **Google Sheets** — adaugă rândul\n5. **Telegram** — te anunță dacă suma e mare",
        "Nodes (steps) in an n8n flow:\n1. **Gmail Trigger** — new email with attachment\n2. **AI Agent / LLM** — extracts supplier, amount, date\n3. **IF** — is the amount over 1000?\n4. **Google Sheets** — adds the row\n5. **Telegram** — alerts you if the amount is large"]},
    {k:"order", q:["Ordonează nodurile fluxului","Order the flow's nodes"],
     tiles:["Gmail Trigger",["AI: extrage datele","AI: extract the data"],["IF: suma > 1000","IF: amount > 1000"],"Google Sheets","Telegram"], mixed:true},
    {k:"mc", q:["Ce face nodul IF?","What does the IF node do?"],
     o:[["Împarte fluxul în funcție de o condiție","Splits the flow based on a condition"],["Trimite emailuri","Sends emails"],["Generează imagini","Generates images"],["Oprește serverul","Stops the server"]], a:0,
     x:["IF = ramificare: un drum dacă e adevărat, altul dacă e fals.","IF = branching: one path if true, another if false."]},
    {k:"learn", e:"🪝", t:["Webhook","Webhooks"],
     b:["Un **webhook** este o adresă web care pornește fluxul când primește date — de exemplu, când cineva completează un formular pe site-ul tău.","A **webhook** is a web address that starts the flow when it receives data — for example, when someone fills in a form on your site."]},
    {k:"fill", q:["Adresa web care pornește un flux când primește date se numește ___.","A web address that starts a flow when it receives data is called a ___."],
     o:["webhook","hashtag","cookie","plugin"], a:0,
     x:["Webhook-urile conectează orice aplicație cu automatizarea ta.","Webhooks connect any app to your automation."]},
    {k:"tf", q:["Un flux bun ar trebui să trimită o alertă și când ceva eșuează.","A good flow should also send an alert when something fails."], a:true,
     x:["Adevărat — altfel nu afli că automatizarea s-a oprit.","True — otherwise you won't know the automation stopped."]}
  ]},
  { id:"u8l5", t:["Agenți de cod și de browser","Coding and browser agents"], items:[
    {k:"learn", e:"🤖", t:["Agenți care lucrează pe calculator","Agents that work on a computer"],
     b:["• **Agenți de cod** (ex. Claude Code) — citesc proiectul, scriu cod, rulează teste și repară erori\n• **Agenți de browser** — navighează pe site-uri, completează formulare\n• **Computer use** — AI-ul vede ecranul și folosește mouse-ul și tastatura\nToți au nevoie de **supraveghere umană** (human-in-the-loop) la pașii importanți.",
        "• **Coding agents** (e.g. Claude Code) — read the project, write code, run tests and fix errors\n• **Browser agents** — navigate websites, fill in forms\n• **Computer use** — the AI sees the screen and uses the mouse and keyboard\nAll of them need **human oversight** (human-in-the-loop) at important steps."]},
    {k:"mc", q:["Ce înseamnă „human-in-the-loop”?","What does “human-in-the-loop” mean?"],
     o:[["Un om aprobă sau verifică pașii importanți","A person approves or checks important steps"],["Omul face totul manual","The person does everything by hand"],["AI-ul controlează omul","The AI controls the person"],["Un tip de buclă for","A kind of for loop"]], a:0,
     x:["Automatizare + control uman = siguranță.","Automation + human control = safety."]},
    {k:"match", q:["Potrivește agentul cu sarcina","Match the agent to the task"],
     p:[[["Agent de cod","Coding agent"],["repară un bug","fixes a bug"]],[["Agent de browser","Browser agent"],["completează un formular online","fills in an online form"]],[["Computer use","Computer use"],["folosește o aplicație desktop","uses a desktop app"]]]},
    {k:"tf", q:["Un agent ar trebui să ceară confirmare înainte de o plată.","An agent should ask for confirmation before a payment."], a:true,
     x:["Adevărat. Plățile, ștergerile și trimiterile de mesaje cer aprobare.","True. Payments, deletions and sending messages need approval."]},
    {k:"order", q:["Ordonează lucrul cu un agent de cod","Order working with a coding agent"],
     tiles:[["Descrii sarcina clar","Agentul face un plan","Aprobi planul","Agentul scrie și testează codul","Verifici rezultatul"],["Describe the task clearly","The agent makes a plan","You approve the plan","The agent writes and tests the code","You review the result"]]}
  ]}
],
u9:[
  { id:"u9l4", t:["Viziune computerizată","Computer vision"], items:[
    {k:"learn", e:"👁️", t:["Cum „vede” AI-ul","How AI “sees”"],
     b:["O imagine e o grilă de **pixeli** (numere). Rețelele **CNN** (convoluționale) învață întâi margini, apoi forme, apoi obiecte întregi. Azi se folosesc și **vision transformers**.\nSarcini: **clasificare** (ce e în poză), **detecție** (unde e fiecare obiect), **segmentare** (contur exact), **OCR** (text din imagini).",
        "An image is a grid of **pixels** (numbers). **CNNs** (convolutional networks) learn edges first, then shapes, then whole objects. **Vision transformers** are also used today.\nTasks: **classification** (what's in the photo), **detection** (where each object is), **segmentation** (exact outline), **OCR** (text from images)."]},
    {k:"match", q:["Potrivește sarcina cu exemplul","Match the task to the example"],
     p:[[["Clasificare","Classification"],["„E o pisică”","“It's a cat”"]],[["Detecție","Detection"],["chenare în jurul mașinilor","boxes around cars"]],[["Segmentare","Segmentation"],["conturul exact al unei tumori","the exact outline of a tumour"]],["OCR",["citește textul unei facturi","reads an invoice's text"]]]},
    {k:"mc", q:["Ce învață primele straturi ale unei CNN?","What do the first layers of a CNN learn?"],
     o:[["Margini și texturi simple","Edges and simple textures"],["Nume de oameni","People's names"],["Prețuri","Prices"],["Gramatică","Grammar"]], a:0,
     x:["Straturile următoare combină marginile în forme și apoi în obiecte.","Later layers combine edges into shapes and then objects."]},
    {k:"fill", q:["Extragerea textului dintr-o fotografie se numește ___.","Extracting text from a photo is called ___."],
     o:["OCR","GPS","USB","PDF"], a:0,
     x:["OCR = Optical Character Recognition.","OCR = Optical Character Recognition."]},
    {k:"tf", q:["Mașinile autonome folosesc detecția de obiecte.","Self-driving cars use object detection."], a:true,
     x:["Adevărat: pietoni, semne, alte mașini — totul trebuie localizat în timp real.","True: pedestrians, signs, other cars — everything must be located in real time."]}
  ]},
  { id:"u9l5", t:["Modele open-source și locale","Open-source and local models"], items:[
    {k:"learn", e:"🔓", t:["Modele deschise","Open models"],
     b:["Unele companii publică „greutățile” modelelor (open-weight): Llama (Meta), Mistral, Qwen, Gemma, DeepSeek. Le găsești pe **Hugging Face**.\nAvantaje: rulezi local, datele nu pleacă din calculator, fără cost per mesaj. Dezavantaje: ai nevoie de hardware bun și de mai multă muncă tehnică.",
        "Some companies publish model “weights” (open-weight): Llama (Meta), Mistral, Qwen, Gemma, DeepSeek. You'll find them on **Hugging Face**.\nPros: run locally, data never leaves your computer, no per-message cost. Cons: you need good hardware and more technical work."]},
    {k:"learn", e:"💻", t:["Rulare locală","Running locally"],
     b:["**Ollama** sau **LM Studio** îți permit să rulezi un model pe laptop cu o singură comandă. **Cuantizarea** micșorează modelul (ex. din 16 biți în 4 biți) ca să încapă în memorie, cu o mică pierdere de calitate.","**Ollama** or **LM Studio** let you run a model on your laptop with a single command. **Quantisation** shrinks the model (e.g. from 16-bit to 4-bit) so it fits in memory, with a small quality loss."],
     c:"ollama run llama3.2"},
    {k:"mc", q:["Care e un avantaj major al unui model rulat local?","What is a major advantage of a locally run model?"],
     o:[["Datele rămân pe calculatorul tău","Your data stays on your computer"],["E mereu cel mai inteligent","It's always the smartest"],["Nu are nevoie de memorie","It needs no memory"],["Știe știrile de azi","It knows today's news"]], a:0,
     x:["Ideal pentru date confidențiale — cu aprobarea organizației.","Ideal for confidential data — with your organisation's approval."]},
    {k:"match", q:["Potrivește termenul","Match the term"],
     p:[["Hugging Face",["platformă cu modele","model hub"]],["Ollama",["rulează modele local","runs models locally"]],[["Cuantizare","Quantisation"],["micșorează modelul","shrinks the model"]],["Llama","Meta"]]},
    {k:"tf", q:["Cuantizarea face modelul mai mic, cu o mică pierdere de calitate.","Quantisation makes the model smaller with a small quality loss."], a:true,
     x:["Adevărat — un compromis între mărime și precizie.","True — a trade-off between size and accuracy."]}
  ]}
],
u10:[
  { id:"u10l4", t:["Alege și evaluează modele","Choose and evaluate models"], items:[
    {k:"learn", e:"📏", t:["Criterii de alegere","Selection criteria"],
     b:["Când alegi un model pentru un proiect, compari:\n• **Calitate** — pe sarcinile TALE, nu doar pe clasamente\n• **Viteză** (latență)\n• **Cost** — de obicei per milion de tokeni de intrare și de ieșire\n• **Fereastra de context**\n• **Confidențialitate** și unde sunt procesate datele",
        "When choosing a model for a project, compare:\n• **Quality** — on YOUR tasks, not just leaderboards\n• **Speed** (latency)\n• **Cost** — usually per million input and output tokens\n• **Context window**\n• **Privacy** and where data is processed"]},
    {k:"learn", e:"🏁", t:["Benchmark-uri","Benchmarks"],
     b:["**Benchmark-urile** sunt teste standard (matematică, cod, raționament). Sunt utile, dar un model bun la benchmark poate fi slab pe sarcina ta. Cel mai bun test: **50–100 de exemple reale** din munca ta.",
        "**Benchmarks** are standard tests (maths, code, reasoning). They're useful, but a model that scores well can still be weak on your task. The best test: **50–100 real examples** from your work."]},
    {k:"mc", q:["Ai un chatbot cu mii de clienți pe zi și întrebări simple. Ce contează mult?","You have a chatbot with thousands of customers a day and simple questions. What matters a lot?"],
     o:[["Costul și viteza","Cost and speed"],["Cel mai mare model existent","The biggest model available"],["Generarea de imagini","Image generation"],["Culoarea logo-ului","The logo colour"]], a:0,
     x:["Pentru sarcini simple la volum mare, un model mai mic și rapid e adesea alegerea bună.","For simple high-volume tasks, a smaller, faster model is often the right choice."]},
    {k:"fill", q:["Timpul până la primirea răspunsului se numește ___.","The time until you receive a reply is called ___."],
     o:[["latență","latency"],["temperatură","temperature"],["etichetă","label"],["context","context"]], a:0,
     x:["Latența mică e esențială pentru voce și chat în timp real.","Low latency is essential for voice and real-time chat."]},
    {k:"tf", q:["Locul 1 într-un clasament garantează cel mai bun model pentru proiectul tău.","First place on a leaderboard guarantees the best model for your project."], a:false,
     x:["Fals. Testează pe datele tale.","False. Test on your own data."]}
  ]},
  { id:"u10l5", t:["Învățarea continuă","Keep learning"], items:[
    {k:"learn", e:"📡", t:["Cum ții pasul","How to keep up"],
     b:["AI-ul se schimbă lunar. Obiceiuri bune:\n• urmărește blogurile oficiale ale companiilor AI\n• încearcă fiecare unealtă nouă pe o sarcină reală\n• construiește un mic proiect pe lună\n• învață concepte, nu doar butoane — conceptele rămân, interfețele se schimbă",
        "AI changes every month. Good habits:\n• follow the official blogs of AI companies\n• try every new tool on a real task\n• build one small project a month\n• learn concepts, not just buttons — concepts stay, interfaces change"]},
    {k:"learn", e:"🧭", t:["Direcții importante","Important directions"],
     b:["• **Agenți** care fac sarcini lungi singuri\n• **Modele de raționament** care „gândesc” înainte de răspuns\n• **Multimodalitate** — text, voce, video, ecran\n• **AI în robotică** și dispozitive\n• **Reglementare** — reguli tot mai clare pentru folosirea AI",
        "• **Agents** that carry out long tasks on their own\n• **Reasoning models** that “think” before answering\n• **Multimodality** — text, voice, video, screen\n• **AI in robotics** and devices\n• **Regulation** — increasingly clear rules for using AI"]},
    {k:"mc", q:["Ce rămâne valabil cel mai mult timp?","What stays useful the longest?"],
     o:[["Conceptele (prompting, RAG, agenți, evaluare)","Concepts (prompting, RAG, agents, evaluation)"],["Locul exact al unui buton","The exact position of a button"],["Prețul de azi","Today's price"],["Numele versiunii actuale","The current version name"]], a:0,
     x:["Uneltele se schimbă; principiile le aplici pe orice unealtă nouă.","Tools change; you apply principles to any new tool."]},
    {k:"order", q:["Ordonează rutina lunară de învățare","Order the monthly learning routine"],
     tiles:[["Citești ce e nou","Alegi o unealtă de încercat","Construiești un mini-proiect","Notezi ce ai învățat"],["Read what's new","Pick a tool to try","Build a mini project","Write down what you learned"]]},
    {k:"tf", q:["Cel mai bun mod de a învăța AI este să-l folosești în proiecte reale.","The best way to learn AI is to use it in real projects."], a:true,
     x:["Adevărat — practica bate teoria. Treci la unitatea de proiecte! 🚀","True — practice beats theory. On to the projects unit! 🚀"]}
  ]}
]};

     b:["Un punct de plecare:","A starting point:"],

    {k:"order", q:["Ordonează pașii proiectului","Order the project steps"],

    {k:"mc", q:["Un client întreabă ceva ce nu e în FAQ. Ce trebuie să facă botul?","A customer asks something not in the FAQ. What should the bot do?"],
     o:[["Să spună că nu știe și să trimită la recepție","Say it doesn't know and refer to the front desk"],["Să inventeze un răspuns","Make up an answer"],["Să ignore întrebarea","Ignore the question"],["Să schimbe subiectul","Change the subject"]], a:0,
     x:["Regula „răspunde doar din FAQ” previne halucinațiile.","The “answer only from the FAQ” rule prevents hallucinations."]},
    {k:"tf", q:["„Răspunde DOAR din FAQ” reduce riscul de informații inventate.","“Answer ONLY from the FAQ” reduces the risk of made-up information."], a:true,
     x:["Adevărat — limitezi sursa de adevăr.","True — you limit the source of truth."]}

  { id:"u11l2", t:["Proiect: automatizare social media","Project: social media automation"], items:[
    {k:"learn", e:"📣", t:["Obiectivul","The goal"],

        "A flow that every Monday takes ideas from a sheet, uses AI to write a post for each, generates an image and puts them in an **approval** queue before publishing."]},
    {k:"order", q:["Ordonează fluxul","Order the flow"],
     tiles:[["Trigger: luni la 9:00","Citește ideile din tabel","AI scrie postările","AI generează imaginile","Trimite spre aprobare","Publică după aprobare"],["Trigger: Monday at 9:00","Read ideas from the sheet","AI writes the posts","AI generates the images","Send for approval","Publish after approval"]]},
    {k:"mc", q:["De ce pui un pas de aprobare înainte de publicare?","Why add an approval step before publishing?"],
     o:[["Ca un om să verifice calitatea și faptele","So a person checks quality and facts"],["Ca să fie mai lent","To make it slower"],["Pentru că AI-ul nu poate publica","Because AI can't publish"],["Nu e nevoie","It isn't needed"]], a:0,
     x:["Ce apare public în numele tău merită verificat.","Anything published in your name deserves a check."]},
    {k:"fill", q:["Un trigger care pornește fluxul la o oră fixă se numește trigger ___.","A trigger that starts the flow at a fixed time is a ___ trigger."],
     o:[["programat","schedule"],["vocal","voice"],["manual","manual"],["aleator","random"]], a:0,

const SRS_STEPS = [1, 3, 7, 14];                      // days until the next review
const addDays = (n, d = new Date()) => { const x = new Date(d); x.setDate(x.getDate() + n); return day(x); };
function srsWrong(k) { S.srs = S.srs || {}; S.srs[k] = { n: 0, due: addDays(1) }; }
function srsRight(k) {
  S.srs = S.srs || {}; const c = S.srs[k] || { n: 0 };
  const n = c.n + 1;
  if (n >= SRS_STEPS.length) { delete S.srs[k]; S.mistakes = S.mistakes.filter(x => x !== k); }  // mastered
  else S.srs[k] = { n, due: addDays(SRS_STEPS[n]) };
}
const srsDue = k => { const c = (S.srs || {})[k]; return !c || c.due <= day(); };
function reviewQueue() {
  const ks = S.mistakes.filter(k => ITEM[k]);
  return ks.filter(srsDue).concat(ks.filter(k => !srsDue(k))).slice(0, 10);
}
const dueCount = () => S.mistakes.filter(k => ITEM[k] && srsDue(k)).length;

async function plabGrade(text) {
  const p = ui.plab; p.text = text; if (text.trim().length < 15) { p.res = { score: 0, good: [], improve: [t("plabShort")], offline: true }; render(); return; }
  p.busy = true; render();

    if (out) { try { const j = JSON.parse(out.slice(out.indexOf("{"), out.lastIndexOf("}") + 1)); if (typeof j.score === "number") { res = { score: Math.max(0, Math.min(100, Math.round(j.score))), good: (j.good || []).slice(0, 2).map(String), improve: (j.improve || []).slice(0, 3).map(String), rewrite: String(j.rewrite || "").slice(0, 900) }; aiSpend(); } } catch (e) {} }
  }
  if (!res) res = gradeOffline(text);
  S.plab = S.plab || {};

  if (res.score > prev) { addXp(Math.max(1, Math.round((res.score - prev) / 10))); S.plab[p.task] = res.score; }

}

async function grantPlan() {
  const g = ui.grant = ui.grant || {}, v = id => document.getElementById(id).value;
  g.emails = v("grEmails"); g.tier = v("grTier"); g.months = v("grMonths"); g.team = v("grTeam").trim();

  if (!emails.length || emails.length > 500) { g.msg = { ok: false, text: t("grantErr") }; return render(); }
  g.busy = true; render();
  try { const r = await BACKEND.grant(emails, g.tier, +g.months, g.tier === "company" ? g.team : ""); g.msg = { ok: true, text: t("grantOk").replace("{n}", r.ok).replace("{m}", r.missing.length ? " · " + t("grantMissing") + ": " + r.missing.join(", ") : "") }; }

  g.busy = false; render();
}

// ---------- Links from the site (?plan=pro) and back from Stripe (?paid=1) ----------
(function planLinks() {
  let q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
  const want = q.get("plan"), paid = q.get("paid");
  if (!want && !paid) return;
  try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
  setTimeout(() => {
    if (paid) { ui.toast = t("premThanks"); loadEnt(); }
    else if (PLANS[want]) { ui.prem = {}; ui.sheet = { type: want === "company" ? "company" : "premium" }; render(); }
  }, 1600);
})();

// ---------- Lifetime seats (real counter from the server) ----------
async function loadSeats() {
  if (!BACKEND.seats) return;
  try { ui.seats = await BACKEND.seats(); if (ui.sheet && ui.sheet.type === "premium") render(); } catch (e) {}
}

function exportData() {
  const data = { app: "LightLearn AI", exportedAt: new Date().toISOString(), account: auth.status === "in" ? { name: auth.name || "", plan: tier(), founder: founderNo() || undefined } : null, progress: pick(S, PKEYS), settings: pick(S, SKEYS) };

}

// ===================== LightLearn AI v7: streak rewards & Lumens shop =====================
// Long streaks earn Lumens (🔆), the in-app currency. Lumens buy hearts and streak freezes.
const LUM = "🔆";
const SHOP = { heart: 30, refill: 120, freeze: 200 };      // prices in Lumens
const MAX_FREEZES = 5;
const lum = () => S.lumeni || 0;

// Called after every lesson / XP gain: grants every streak reward reached and celebrates it.
function streakRewards() {
  const st = streakNow(), got = [];
  S.streakClaims = Object.assign({}, S.streakClaims);
  MILESTONES.forEach(m => { if (st >= m.d && !S.streakClaims[m.d]) { S.streakClaims[m.d] = true; got.push(m); } });
  for (let k = 200; k <= st; k += 100) if (!S.streakClaims[k]) { S.streakClaims[k] = true; got.push({ d: k, lum: 1000, xp: 300, f: 1, e: "🌟" }); }  // every extra 100 days
  if (!got.length) return;
  got.forEach(m => { S.lumeni = lum() + (m.lum || 0); S.freezes = Math.min(MAX_FREEZES, (S.freezes || 0) + (m.f || 0)); if (m.xp) S.xp += m.xp; });
  save();
  ui.rewardQueue = (ui.rewardQueue || []).concat(got);
}
function showRewardIfAny() {
  if (!ui.rewardQueue || !ui.rewardQueue.length || ui.sheet || sess) return;
  ui.sheet = { type: "reward", m: ui.rewardQueue.shift() }; sfx("win"); vib(60); render();
}
function renderReward(m) {
  return `<div style="text-align:center"><div class="float" style="font-size:64px">${m.e}</div><h3 style="margin:8px 0 4px">${esc(t("rwT").replace("{d}", m.d))}</h3><p class="sub" style="margin-top:0">${esc(t("rwS"))}</p></div>
  <div class="rwgot"><div><b>+${m.lum} ${LUM}</b><small>${esc(t("lumName"))}</small></div>${m.f ? `<div><b>+${m.f} 🧊</b><small>${esc(t("freezes"))}</small></div>` : ""}${m.xp ? `<div><b>+${m.xp} ⚡</b><small>XP</small></div>` : ""}</div>
  <div class="tiny" style="text-align:center;margin:10px 0">${esc(t("rwUse"))}</div>
  <div class="row" style="display:flex;gap:8px"><button class="btn ghost" data-act="closeSheet">${esc(t("cont"))}</button><button class="btn gold" data-act="shop">${LUM} ${esc(t("shopGo"))}</button></div>`;
}

// ---------- Shop ----------
function renderShop() {
  const inf = infHearts(), missing = 5 - S.hearts, fz = S.freezes || 0;
  const item = (act, e, title, sub, price, ok, why) => `<div class="shopi"><span class="se">${e}</span><div class="st"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
    <button class="buy" data-act="${act}" ${ok && lum() >= price ? "" : "disabled"}>${ok ? `${price} ${LUM}` : esc(why)}</button></div>`;
  const msg = ui.shopMsg ? `<div class="amsg ${ui.shopMsg.ok ? "ok" : "err"}">${esc(ui.shopMsg.text)}</div>` : "";
  return `<div style="text-align:center"><h3 style="margin-bottom:2px">${LUM} ${esc(t("shopT"))}</h3><div class="lumbal">${lum()} <small>${esc(t("lumName"))}</small></div></div>${msg}
  ${item("buyHeart", "❤️", t("buyHeart"), inf ? t("haveInf") : `${S.hearts}/5`, SHOP.heart, !inf && missing > 0, inf ? "∞" : t("full"))}
  ${item("buyRefill", "💖", t("buyRefill"), inf ? t("haveInf") : t("buyRefillS"), SHOP.refill, !inf && missing > 1, inf ? "∞" : t("full"))}
  ${item("buyFreeze", "🧊", t("buyFreeze"), `${fz}/${MAX_FREEZES} · ${t("buyFreezeS")}`, SHOP.freeze, fz < MAX_FREEZES, t("full"))}
  <div class="card" style="margin-top:12px"><div style="font-weight:900;margin-bottom:6px">${esc(t("earnHow"))}</div>
   ${MILESTONES.map(m => { const got = (S.streakClaims || {})[m.d]; return `<div class="mrow"><span class="me">${m.e}</span><div class="mt"><b>${m.d} ${esc(t("daysN"))}</b><small>+${m.lum} ${LUM}${m.f ? ` · +${m.f} 🧊` : ""}</small></div><span class="tiny" style="margin:0">${got ? "✓" : streakNow() + "/" + m.d}</span></div>`; }).join("")}
   <div class="tiny">${esc(t("earnMore"))}</div></div>
  <button class="btn ghost" data-act="closeSheet" style="margin-top:10px">${esc(t("cont"))}</button>`;
}
function buy(kind) {
  const price = SHOP[kind]; ui.shopMsg = null;
  if (lum() < price) { ui.shopMsg = { ok: false, text: t("notEnough") }; return render(); }
  refreshHearts();
  if (kind === "heart") { if (infHearts() || S.hearts >= 5) return; S.hearts += 1; }
  if (kind === "refill") { if (infHearts() || S.hearts >= 4) return; S.hearts = 5; }
  if (kind === "freeze") { if ((S.freezes || 0) >= MAX_FREEZES) return; S.freezes = (S.freezes || 0) + 1; }
  if (S.hearts >= 5) S.heartsTs = Date.now();
  S.lumeni = lum() - price; save(); sfx("win"); vib(30);
  ui.shopMsg = { ok: true, text: t("bought") };
  if (ui.sheet && ui.sheet.type === "noHearts") ui.sheet = null;
  render();
}
function v7Sheet(s) {
  if (s.type === "shop") return renderShop();
  if (s.type === "reward") return renderReward(s.m);
  return null;
}
function v7Act(a) {
  switch (a) {
    case "shop": ui.shopMsg = null; ui.sheet = { type: "shop" }; render(); return true;
    case "buyHeart": buy("heart"); return true;
    case "buyRefill": buy("refill"); return true;
    case "buyFreeze": buy("freeze"); return true;
  }
  return false;
}

// Your own picture: cropped to a square, resized to 256 px and stored as a small JPEG in your account.
function loadOwnPhoto(file) {
  ui.avErr = null;
  if (!file || !/^image\/(jpeg|png|webp|gif)$/.test(file.type) || file.size > 15 * 1024 * 1024) { ui.avErr = t("avUploadErr"); return render(); }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    try {
      const n = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas"); c.width = c.height = 256;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 256, 256);
      g.drawImage(img, (img.naturalWidth - n) / 2, (img.naturalHeight - n) / 2, n, n, 0, 0, 256, 256);
      let q = .85, out = c.toDataURL("image/jpeg", q);
      while (out.length > 45000 && q > .4) { q -= .1; out = c.toDataURL("image/jpeg", q); }
      ui.avImg = out; ui.avMode = "upload";
    } catch (e) { ui.avErr = t("avUploadErr"); }
    URL.revokeObjectURL(url); render();
  };
  img.onerror = () => { URL.revokeObjectURL(url); ui.avErr = t("avUploadErr"); render(); };
  img.src = url;
}
function v8Bind() {   // a photo that fails to load falls back to the custom avatar
  const f = document.getElementById("avFile");
  if (f) f.addEventListener("change", () => loadOwnPhoto(f.files && f.files[0]));
  document.querySelectorAll("img.avph:not([data-b])").forEach(img => {
    img.setAttribute("data-b", "1");
    img.addEventListener("error", () => { const w = img.parentElement; const sz = +img.getAttribute("width") || 48; if (w) w.innerHTML = avatarSvg(avCfg(), sz); });
  });
}

 try{await BACKEND.save(pick(S,PKEYS));auth.sync="ok";}
 catch(e){const c=e&&e.code;
  if(c==="invalid_argument"||c==="permission-denied"||c==="not_granted"){cBusy=false;auth.status="guest";auth.err=t("noWrite");ui.sheet={type:"auth"};render();return;}
  auth.sync="err";cDirty=true;setTimeout(flushCloud,3000+Math.random()*2000);}
 cBusy=false;paintSync();if(cDirty&&auth.sync!=="err")setTimeout(flushCloud,400);}

function mergeProgress(c,l){if(!c)return pick(l,PKEYS);{const cr=c.resetAt||0,lr=l.resetAt||0;if(cr>lr&&(l.lastDay||"")<day(new Date(cr)))return pick(c,PKEYS);if(lr>cr&&(c.lastDay||"")<day(new Date(lr)))return pick(l,PKEYS);}const o=pick(c,PKEYS),newer=(c.lastDay||"")>=(l.lastDay||"");
 o.done=Object.assign({},c.done||{},l.done);o.reviews=Object.assign({},c.reviews||{},l.reviews);
 o.mistakes=[...new Set([].concat(c.mistakes||[],l.mistakes||[]))];
 o.resetAt=Math.max(c.resetAt||0,l.resetAt||0);o.lumeni=Math.max(c.lumeni||0,l.lumeni||0);o.streakClaims=Object.assign({},l.streakClaims||{},c.streakClaims||{});o.srs=Object.assign({},l.srs||{},c.srs||{});o.plab=Object.assign({},l.plab||{});for(const k in (c.plab||{}))o.plab[k]=Math.max(o.plab[k]||0,c.plab[k]);o.friends=[...new Set([].concat(c.friends||[],l.friends||[]))].slice(0,29);
 ["xp","ans","cor","unlockedUnit"].forEach(k=>o[k]=Math.max(c[k]||0,l[k]||0));
 if(!newer){o.streak=l.streak;o.lastDay=l.lastDay;o.today=l.today;}
 else if(l.today&&c.today&&l.today.date===c.today.date)o.today={date:c.today.date,xp:Math.max(c.today.xp,l.today.xp)};
 o.hist=Object.assign({},c.hist||{});Object.entries(l.hist||{}).forEach(([d,x])=>o.hist[d]=Math.max(o.hist[d]||0,x));
 o.badges=Object.assign({},c.badges||{},l.badges||{});o.perfect=!!(c.perfect||l.perfect);
 o.finishedAt=c.finishedAt&&l.finishedAt?Math.min(c.finishedAt,l.finishedAt):(c.finishedAt||l.finishedAt||null);
 o.streakClaims=Object.assign({},c.streakClaims||{},l.streakClaims||{});o.freezes=Math.max(c.freezes||0,l.freezes||0);

async function doSignIn(provider){if(auth.busy)return;auth.err="";auth.info="";
 if(provider==="email"){const em=auth.em.trim(),pw=auth.pw;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){auth.err=t("errEmail");render();return;}
  if(auth.mode==="register"&&!(pw.length>=8&&/[A-Za-z]/.test(pw)&&/\d/.test(pw))){auth.err=t("pwRule");render();return;}}
 auth.busy=true;render();
 try{const r=await BACKEND.signIn(provider,{email:auth.em.trim(),password:auth.pw,register:auth.mode==="register"});
  if(r&&r.info)auth.info=t(r.info);onSignedIn(r);}
 catch(e){auth.busy=false;auth.err=t((e&&e.key)||"authErr");render();}}

/* helpers */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const t=k=>{const d=I18N[S.lang||ui.obLang||"ro"]||I18N.en;return d[k]!==undefined?d[k]:I18N.en[k];};
const ci=()=>((S.lang||ui.obLang)==="ro"?0:1);
const L=v=>Array.isArray(v)?(v[ci()]!==undefined?v[ci()]:v[1]):v;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const shuffleNot=a=>{let s=a;for(let n=0;n<12;n++){s=shuffle(a);if(a.length<2||s.some((v,i)=>v!==a[i]))break;}return s;};
const day=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const yday=()=>day(new Date(Date.now()-864e5));
const d2=()=>day(new Date(Date.now()-2*864e5));
const streakNow=()=>(S.lastDay===day()||S.lastDay===yday()||(S.lastDay===d2()&&(S.freezes||0)>0))?S.streak:0;
const todayXp=()=>S.today.date===day()?S.today.xp:0;
function addXp(n){const d=day();if(S.lastDay!==d){if(S.lastDay===yday())S.streak++;else if(S.lastDay===d2()&&(S.freezes||0)>0){S.freezes--;S.streak++;}else S.streak=1;S.lastDay=d;}if(S.today.date!==d)S.today={date:d,xp:0};S.today.xp+=n;S.xp+=n;S.hist=S.hist||{};S.hist[d]=(S.hist[d]||0)+n;
 const ks=Object.keys(S.hist).sort();if(ks.length>60)ks.slice(0,ks.length-60).forEach(k=>delete S.hist[k]);save();}
function refreshHearts(){if(S.hearts>=5){S.hearts=5;S.heartsTs=Date.now();return;}const n=Math.floor((Date.now()-S.heartsTs)/REFILL);if(n>0){S.hearts=Math.min(5,S.hearts+n);S.heartsTs+=n*REFILL;if(S.hearts>=5)S.heartsTs=Date.now();save();}}
function loseHeart(){if(infHearts())return;refreshHearts();if(S.hearts>=5)S.heartsTs=Date.now();S.hearts=Math.max(0,S.hearts-1);save();}
const levelOf=xp=>{let i=0;LEVELS.forEach((v,j)=>{if(xp>=v)i=j;});return i;};
function md(s){const lines=esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").split("\n");let h="",list=null;
 for(const ln of lines){let m;if((m=ln.match(/^• (.*)/))){if(list!=="ul"){if(list)h+="</"+list+">";h+="<ul>";list="ul";}h+="<li>"+m[1]+"</li>";}
  else if((m=ln.match(/^\d+\. (.*)/))){if(list!=="ol"){if(list)h+="</"+list+">";h+="<ol>";list="ol";}h+="<li>"+m[1]+"</li>";}
  else{if(list){h+="</"+list+">";list=null;}if(ln.trim())h+="<p>"+ln+"</p>";}}
 if(list)h+="</"+list+">";return h;}
function codeHtml(src,blank){let h=String(src).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function renderPath(){const cur=curIdx();const offs=[0,52,78,52,0,-52,-78,-52];let n=0,h="";

 const wire=(o1,o2,lit,flow)=>`<svg class="wire${lit?" lit":""}${flow?" flow":""}" viewBox="0 0 260 50" width="260" height="50" aria-hidden="true"><path class="w" d="M${130+o1} 0 V20 Q${130+o1} 25 ${130+o1+(o2>o1?5:o2<o1?-5:0)} 25 H${130+o2-(o2>o1?5:o2<o1?-5:0)} Q${130+o2} 25 ${130+o2} 30 V50"/>${flow?`<path class="p" d="M${130+o1} 0 V20 Q${130+o1} 25 ${130+o1+(o2>o1?5:o2<o1?-5:0)} 25 H${130+o2-(o2>o1?5:o2<o1?-5:0)} Q${130+o2} 25 ${130+o2} 30 V50"/>`:""}<circle cx="${130+o1}" cy="2" r="3.2"/><circle cx="${130+o2}" cy="48" r="3.2"/></svg>`;

  h+=`<div class="hud" style="--c:${u.color};--cd:${u.dark}"><i class="hc tl"></i><i class="hc tr"></i><i class="hc bl"></i><i class="hc br"></i>

  const nodes=[];

  nodes.push({kind:"r",open:unitDone(uix)||full(),done:!!S.reviews[u.id]});
  nodes.forEach((nd,k)=>{const off=offs[n%8];
   if(k>0){const prev=nodes[k-1],po=offs[(n-1)%8];h+=`<div class="wrow">${wire(po,off,prev.done,nd.cur||(nd.kind==="r"&&nd.open&&!nd.done))}</div>`;}

 else if(s.type==="auth"){inner=renderAuth();}

/* ================= LESSONS ================= */
function startSession(kind,payload){let items=[];const nonLearn=x=>x.it.k!=="learn";
 const fromLesson=l=>l.items.map((it,ii)=>({key:l.id+":"+ii,it}));
 if(kind==="lesson")items=fromLesson(ALL[payload].l);
 else if(kind==="review")items=shuffle([].concat(...UNITS[payload].lessons.map(fromLesson)).filter(nonLearn)).slice(0,8);
 else if(kind==="mistakes")items=reviewQueue().map(k=>({key:k,it:ITEM[k]}));
 else{let ls=ALL.filter(a=>S.done[a.l.id]).map(a=>a.l);if(!ls.length)ls=[ALL[0].l];items=shuffle([].concat(...ls.map(fromLesson)).filter(nonLearn)).slice(0,8);}
 if(!items.length)return;
 sess={kind,payload,queue:items,total:items.length,i:0,mist:0,combo:0,anim:-1,first:{},rep:{},practice:kind==="mistakes"||kind==="quick",phase:"answer",fb:null,cur:null};
 ui.sheet=null;initCur();window.scrollTo(0,0);render();}

function initCur(){const it=sess.queue[sess.i].it,c={sel:null};
 if(it.k==="mc"||it.k==="fill"||it.k==="code")c.perm=shuffle(it.o.map((_,i)=>i));
 if(it.k==="order"){c.tiles=getTiles(it);c.bank=shuffleNot(c.tiles.map((_,i)=>i));c.ans=[];}
 if(it.k==="match"){const ix=it.p.map((_,i)=>i);c.Lo=shuffle(ix);c.Ro=shuffle(ix);c.m=[];c.pl=null;c.pr=null;c.wrong=false;c.flash=null;}
 sess.cur=c;sess.phase="answer";sess.fb=null;}

const hintKey={mc:"hMc",tf:"hTf",fill:"hFill",code:"hCode",order:"hOrder",match:"hMatch"};
function renderLesson(){if(sess.phase==="end")return renderEnd();
 const q=sess.queue[sess.i],it=q.it,c=sess.cur,pct=Math.round(100*Math.min(sess.i,sess.total)/sess.total);
 const fb=sess.phase==="fb";let b="";
 if(it.k==="learn"){b=`<div class="learn"><div class="le">${it.e||"💡"}</div><h2>${esc(L(it.t))}</h2><button class="listen" data-act="speak">🔊 ${esc(t("listen"))}</button><div class="lt">${md(L(it.b))}</div>${it.c?codeHtml(L(it.c)):""}</div>`;}
 else{b=`<div class="hint">${esc(t(hintKey[it.k]))}</div>`;
  if(it.k==="mc"){b+=`<h2 class="q">${esc(L(it.q))}</h2>${it.c?codeHtml(L(it.c)):""}<div class="opts">${c.perm.map((oi,j)=>{let cl="";if(fb){if(oi===it.a)cl="right";else if(j===c.sel)cl="wrong";}else if(j===c.sel)cl="sel";return `<button class="opt ${cl}" data-act="opt" data-j="${j}">${esc(L(it.o[oi]))}</button>`;}).join("")}</div>`;}
  else if(it.k==="tf"){const o=[t("tTrue"),t("tFalse")];b+=`<div class="stmt">${axi("happy",64)}<div class="say">${esc(L(it.q))}</div></div><div class="tf">${o.map((lab,j)=>{let cl="";const right=(j===0)===it.a;if(fb){if(right)cl="right";else if(j===c.sel)cl="wrong";}else if(j===c.sel)cl="sel";return `<button class="opt ${cl}" data-act="opt" data-j="${j}">${j===0?"✅":"❌"} ${esc(lab)}</button>`;}).join("")}</div>`;}
  else if(it.k==="fill"){const parts=L(it.q).split("___");const sel=c.sel===null?null:L(it.o[c.perm[c.sel]]);
   b+=`<div class="sentence">${esc(parts[0])}<span class="blank">${sel===null?"&nbsp;":esc(sel)}</span>${esc(parts[1]||"")}</div><div class="chips">${c.perm.map((oi,j)=>`<button class="chip ${j===c.sel?"sel":""}" data-act="opt" data-j="${j}">${esc(L(it.o[oi]))}</button>`).join("")}</div>`;}
  else if(it.k==="code"){const sel=c.sel===null?null:L(it.o[c.perm[c.sel]]);
   b+=`<h2 class="q">${esc(L(it.q))}</h2>${codeHtml(L(it.c),sel)}<div class="chips">${c.perm.map((oi,j)=>`<button class="chip mono ${j===c.sel?"sel":""}" data-act="opt" data-j="${j}">${esc(L(it.o[oi]))}</button>`).join("")}</div>`;}
  else if(it.k==="order"){const v=it.mono||c.tiles.some(x=>x.length>26)?" v":"",mono=it.mono?" mono":"";
   b+=`<h2 class="q">${esc(L(it.q))}</h2><div class="ozone${v}">${c.ans.map((k,p)=>`<button class="tile${mono}" data-act="otake" data-j="${p}">${esc(c.tiles[k])}</button>`).join("")}</div>
   <div class="obank${v}">${c.bank.map(k=>`<button class="tile${mono} ${c.ans.includes(k)?"ghost":""}" data-act="obank" data-k="${k}">${esc(c.tiles[k])}</button>`).join("")}</div>`;}
  else if(it.k==="match"){const cell=(side,k,txt)=>{let cl="";if(c.m.includes(k))cl=fb?"hit":"done";else if((side==="L"?c.pl:c.pr)===k)cl="sel";if(c.flash&&c.flash[side]===k)cl="flash";return `<button class="mb ${cl}" data-act="m${side}" data-k="${k}">${esc(txt)}</button>`;};
   b+=`<h2 class="q">${esc(L(it.q))}</h2><div class="mgrid"><div class="mcol">${c.Lo.map(k=>cell("L",k,L(it.p[k][0]))).join("")}</div><div class="mcol">${c.Ro.map(k=>cell("R",k,L(it.p[k][1]))).join("")}</div></div>`;}}
 let foot;
 if(fb){const f=sess.fb;const good=t("good");
  foot=`<div class="lfoot fb ${f.ok?"ok":"bad"}"><div class="in"><h4>${f.ok?(sess.combo>=3?"🔥 "+sess.combo+" "+esc(t("combo"))+"!":"🎉 "+esc(good[sess.i%good.length])):"💡 "+esc(t("bad"))}</h4>
  ${!f.ok&&f.ans?`<p class="ans">${esc(t("correctAns"))} ${esc(f.ans)}</p>`:""}${it.x?`<p class="ex">${esc(L(it.x))}</p>`:""}
  ${!f.ok?`<button class="lbtn" data-act="tutor" style="margin:0 0 10px">🤖 ${esc(t("tutBtn"))}</button>`:""}
  <button class="btn ${f.ok?"ok":"bad"}" data-act="next">${esc(t("cont"))}</button></div></div>`;}
 else if(it.k==="learn")foot=`<div class="lfoot"><div class="in"><button class="btn" data-act="next">${esc(t("cont"))}</button></div></div>`;
 else if(it.k==="match")foot="";
 else{const ready=it.k==="order"?c.ans.length===c.tiles.length:c.sel!==null;foot=`<div class="lfoot"><div class="in"><button class="btn ok" data-act="check" ${ready?"":"disabled"}>${esc(t("check"))}</button></div></div>`;}
 const hearts=sess.practice||infHearts()?`<span class="stat heart">∞</span>`:`<span class="stat heart">❤️ ${S.hearts}</span>`;
 return `<div class="les"><div class="lhead"><button class="x" data-act="quit" aria-label="${esc(t("quit"))}">✕</button><div class="bar"><i style="width:${pct}%"></i></div>${hearts}</div><div class="lbody${sess.anim!==sess.i?" enter":""}">${b}</div>${foot}</div>`;}

function correctText(it){if(it.k==="mc"||it.k==="code")return L(it.o[it.a]);if(it.k==="fill")return L(it.q).replace("___",L(it.o[it.a]));
 if(it.k==="tf")return it.a?t("tTrue"):t("tFalse");if(it.k==="order")return getTiles(it).join(it.mono?"  ⏎  ":" → ");return "";}

function markWrong(q){sess.mist++;if(!S.mistakes.includes(q.key))S.mistakes.push(q.key);srsWrong(q.key);if(!sess.practice)loseHeart();sfx("bad");vib(80);}
function grade(ok){const q=sess.queue[sess.i],it=q.it;S.ans++;if(ok)S.cor++;
 if(!(q.key in sess.first))sess.first[q.key]=ok;
 if(ok){sess.combo++;sfx("ok");if(sess.practice&&S.mistakes.includes(q.key))srsRight(q.key);}
 else{sess.combo=0;markWrong(q);const r=sess.rep[q.key]||0;if(r<2){sess.rep[q.key]=r+1;sess.queue.push(q);}}
 sess.phase="fb";sess.fb={ok,ans:ok?null:correctText(it)};save();render();}

function check(){const it=sess.queue[sess.i].it,c=sess.cur;let ok=false;
 if(it.k==="mc"||it.k==="fill"||it.k==="code")ok=c.perm[c.sel]===it.a;
 else if(it.k==="tf")ok=(c.sel===0)===it.a;
 else if(it.k==="order")ok=c.ans.map(k=>c.tiles[k]).join("\u0001")===c.tiles.join("\u0001");
 grade(ok);}

function matchTap(side,k){const c=sess.cur,q=sess.queue[sess.i];if(c.m.includes(k)||c.flash)return;
 if(side==="L")c.pl=c.pl===k?null:k;else c.pr=c.pr===k?null:k;sfx("tap");
 if(c.pl!==null&&c.pr!==null){if(c.pl===c.pr){c.m.push(c.pl);c.pl=c.pr=null;
   if(c.m.length===q.it.p.length){S.ans++;if(!c.wrong)S.cor++;if(!(q.key in sess.first))sess.first[q.key]=!c.wrong;if(!c.wrong&&sess.practice&&S.mistakes.includes(q.key))srsRight(q.key);
    sfx("ok");sess.phase="fb";sess.fb={ok:!c.wrong,ans:null};save();}else sfx("ok");}
  else{if(!c.wrong){c.wrong=true;markWrong(q);}else{sfx("bad");vib(60);}c.flash={L:c.pl,R:c.pr};c.pl=c.pr=null;
   setTimeout(()=>{if(sess&&sess.cur===c){c.flash=null;render();}},550);}}
 render();}

function next(){if(!sess.practice&&!infHearts()&&S.hearts<=0){sess=null;ui.sheet={type:"noHearts"};ui.scrollCur=true;render();return;}
 sess.i++;if(sess.i>=sess.queue.length)return finish();initCur();window.scrollTo(0,0);render();
 const it=sess.queue[sess.i].it;if(S.autoRead&&it.k==="learn")speak(L(it.t)+". "+L(it.b));}

function finish(){let xp,bonus=false;const k=sess.kind;
 if(k==="lesson"){const id=ALL[sess.payload].l.id;if(S.done[id])xp=5;else{xp=10;if(sess.mist===0){xp+=5;bonus=true;}}S.done[id]=true;}
 else if(k==="review"){const id=UNITS[sess.payload].id;xp=S.reviews[id]?5:15;S.reviews[id]=true;}
 else{xp=10;refreshHearts();S.hearts=Math.min(5,S.hearts+1);}
 const ks=Object.keys(sess.first),acc=ks.length?Math.round(100*ks.filter(x=>sess.first[x]).length/ks.length):100;
 const lv0=levelOf(S.xp);if(k==="lesson"&&sess.mist===0)S.perfect=true;
 addXp(xp);if(!S.finishedAt&&Object.keys(S.done).length>=ALL.length)S.finishedAt=Date.now();
 S.badges=S.badges||{};const nb=BADGES.filter(b=>!S.badges[b.id]&&b.ok(S));nb.forEach(b=>S.badges[b.id]=Date.now());save();
 streakRewards();pushLeague();const lv1=levelOf(S.xp);sess.res={xp,acc,bonus,levelUp:lv1>lv0?lv1:null,badges:nb};sess.phase="end";sfx("win");vib(40);render();}

function renderEnd(){const r=sess.res,conf=["#7C5CFF","#1FBF85","#FFB800","#FF4D8B","#1CB0F6"];
 let cf="";for(let i=0;i<40;i++)cf+=`<i style="left:${Math.random()*100}%;background:${conf[i%5]};animation-duration:${1.6+Math.random()*1.8}s;animation-delay:${Math.random()*.6}s"></i>`;
 const goalMsg=todayXp()>=S.goal?`<p class="msg">${esc(t("goalMet"))}</p>`:"";
 return `<div class="confetti">${cf}</div><div class="end"><div class="pop">${axi("party",140)}</div><h2>${esc(sess.practice?t("practiceDone"):t("done"))}</h2>
 ${r.bonus?`<p class="msg">⭐ ${esc(t("perfect"))}</p>`:""}${sess.practice?`<p class="msg">${esc(t("heartBonus"))}</p>`:""}
 <div class="boxes"><div class="ebox" style="--bc:#FFB800"><div class="h">${esc(t("xpEarned"))}</div><div class="v">⚡ ${r.xp}</div></div>
 <div class="ebox" style="--bc:#1FBF85"><div class="h">${esc(t("accuracy"))}</div><div class="v">🎯 ${r.acc}%</div></div>
 <div class="ebox" style="--bc:#FF8A00"><div class="h">${esc(t("streak"))}</div><div class="v">🔥 ${streakNow()}</div></div></div>${goalMsg}
 ${r.levelUp!==null&&r.levelUp!==undefined?`<div class="lvup pop">⬆️ ${esc(t("levelUp"))}<b>${esc(t("levels")[r.levelUp])}</b></div>`:""}
 ${r.badges&&r.badges.length?`<div style="margin-top:12px;font-weight:900;color:var(--gold)">🏅 ${esc(t("newBadge"))}</div><div class="nb">${r.badges.map(b=>`<span class="pop">${b.e} ${esc(L(b.t))}</span>`).join("")}</div>`:""}
 ${auth.status==="in"?"":`<div class="amsg err" style="width:100%;margin-top:10px">⚠️ ${esc(t("guestEnd"))} <button class="link" data-act="authSheet">${esc(t("login"))}</button></div>`}
 <div style="height:16px"></div><button class="btn" data-act="endOk">${esc(t("cont"))}</button>${adBanner("end")}</div>`;}

/* ================= EVENTS ================= */
app.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v;if(v9Act(a,el,v)||v8Act(a,el,v)||v7Act(a,el,v)||v6Act(a,el,v)||v5Act(a,el,v))return;
 switch(a){
 case "obLang":ui.obLang=v;sfx("tap");render();break;
 case "obLevel":ui.obLevel=+v;sfx("tap");render();break;
 case "obGoal":ui.obGoal=+v;sfx("tap");render();break;
 case "obNext":ui.ob++;render();break;
 case "obDone":S.lang=ui.obLang;S.goal=ui.obGoal;S.unlockedUnit=ui.obLevel?2:0;S.onboard=true;save();ui.scrollCur=true;sfx("win");render();break;
 case "tab":ui.tab=v;ui.sheet=null;if(v==="settings"){ui.chestMsg=false;ui.fbMsg=null;ui.socMsg=null;ui.mktMsg=null;loadInbox();loadPrefs();}if(v==="learn")ui.scrollCur=true;else window.scrollTo(0,0);render();break;
 case "langSheet":ui.sheet={type:"lang"};render();break;
 case "setLang":S.lang=v;save();ui.sheet=null;if(ui.prefs&&ui.prefs.marketing&&emailOk())BACKEND.setPrefs(true,v).catch(()=>{});render();break;
 case "mkt":setMkt(v==="1");break;
 case "node":ui.sheet={type:"node",i:+el.dataset.i};sfx("tap");render();break;
 case "rnode":ui.sheet={type:"rnode",u:+el.dataset.u};sfx("tap");render();break;
 case "closeSheet":ui.sheet=null;render();break;
 case "go":if(S.hearts<=0&&!infHearts()){ui.sheet={type:"noHearts"};render();}else startSession("lesson",+el.dataset.i);break;
 case "goReview":if(S.hearts<=0&&!infHearts()){ui.sheet={type:"noHearts"};render();}else startSession("review",+el.dataset.u);break;
 case "pr":startSession(v,null);break;
 case "toPractice":ui.sheet=null;ui.tab="practice";render();break;
 case "opt":if(sess.phase!=="answer")break;sess.cur.sel=+el.dataset.j;sfx("tap");render();break;
 case "obank":if(sess.phase!=="answer")break;{const k=+el.dataset.k;if(!sess.cur.ans.includes(k)){sess.cur.ans.push(k);sfx("tap");render();}}break;
 case "otake":if(sess.phase!=="answer")break;sess.cur.ans.splice(+el.dataset.j,1);sfx("tap");render();break;
 case "mL":case "mR":if(sess.phase!=="answer")break;matchTap(a[1],+el.dataset.k);break;
 case "check":check();break;
 case "next":next();break;
 case "speak":{const it=sess.queue[sess.i].it;speak(L(it.t)+". "+L(it.b));}break;
 case "quit":if(sess.phase==="end"){sess=null;render();break;}ui.sheet={type:"quit"};render();break;
 case "quitYes":sess=null;ui.sheet=null;ui.scrollCur=ui.tab==="learn";render();break;
 case "endOk":{const p=sess.practice;sess=null;ui.tab=p?"practice":"learn";ui.scrollCur=!p;render();showRewardIfAny();}break;
 case "set":{const k=el.dataset.k;let val=v;if(k==="goal")val=+v;if(["sound","fullAccess","reduceMotion","vibrate","autoRead"].includes(k))val=v==="true";if(k==="voiceRate")val=parseFloat(v);S[k]=val;save();render();}break;
 case "lib":ui.lib=v;render();break;
 case "chest":if(S.chestDay!==day()){S.chestDay=day();refreshHearts();S.hearts=Math.min(5,S.hearts+1);addXp(5);streakRewards();setTimeout(showRewardIfAny,600);S.badges=S.badges||{};BADGES.forEach(b=>{if(!S.badges[b.id]&&b.ok(S))S.badges[b.id]=Date.now();});save();ui.chestMsg=true;sfx("win");vib(40);render();}break;
 case "claimStreak":{const m=MILESTONES.find(x=>String(x.d)===v);if(m&&streakNow()>=m.d&&!(S.streakClaims||{})[m.d]){S.streakClaims=Object.assign({},S.streakClaims,{[m.d]:true});S.freezes=Math.min(5,(S.freezes||0)+(m.f||0));S.lumeni=(S.lumeni||0)+(m.lum||0);addXp(m.xp);sfx("win");render();}}break;
 case "testVoice":speak(t("welcomeS"));break;
 case "authSheet":auth.err="";auth.info="";ui.sheet={type:"auth"};render();break;
 case "signin":doSignIn(v);break;
 case "authMode":auth.mode=auth.mode==="login"?"register":"login";auth.err="";auth.info="";render();break;
 case "forgot":doReset();break;
 case "logout":doSignOut();break;
 case "rmTester":auth.err="";saveTesters(auth.testers.filter(x=>x!==v));break;
 case "addTester":auth.err="";if(auth.testers.length<5&&!auth.testers.includes(v))saveTesters(auth.testers.concat([v]));break;
 case "copyId":try{navigator.clipboard.writeText(v).then(()=>{el.textContent=t("copied");},()=>{});}catch(e){}break;
 case "delSheet":auth.err="";ui.sheet={type:"del"};render();break;
 case "delYes":doDelete();break;
 case "resetSheet":ui.sheet={type:"reset"};render();break;
 case "resetYes":{const keep={lang:S.lang,theme:S.theme,sound:S.sound,goal:S.goal};S=Object.assign(DEF(),keep,{onboard:true});save();ui.sheet=null;ui.tab="learn";ui.scrollCur=true;render();}break;
 }});

function bindAdmin(){const tq=document.getElementById("tq"),tres=document.getElementById("tres");
 if(tq&&tres){let seq=0;const run=async()=>{const my=++seq;const hits=(await BACKEND.searchPeople(tq.value.trim())).filter(h=>!auth.testers.includes(h.id));if(my!==seq)return;
  tres.innerHTML=hits.length?hits.slice(0,6).map(h=>`<button class="hit" data-act="addTester" data-v="${esc(h.id)}">＋ ${esc(h.name)}</button>`).join(""):`<div class="tiny">${esc(t("noPeople"))}</div>`;};
  tq.addEventListener("focus",run);tq.addEventListener("input",run);}
 const tf=document.getElementById("tform");if(tf)tf.addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("tin").value.trim();
  if(v&&auth.testers.length<5&&!auth.testers.includes(v)){auth.err="";saveTesters(auth.testers.concat([v]));}});}
function bindMain(){bindAdmin();const q=document.getElementById("gq");if(!q)return;
 const f=()=>{ui.gq=q.value;const s=q.value.trim().toLowerCase();document.querySelectorAll(".gitem").forEach(g=>g.classList.toggle("hidden",!!s&&!g.dataset.s.includes(s)));};q.addEventListener("input",f);f();}

setInterval(()=>{if(!sess&&!ui.sheet&&S.onboard&&S.hearts<5){const h=S.hearts;refreshHearts();if(S.hearts!==h)render();}},60000);
render();
BACKEND.start(r=>{loadSocial();if(r&&r.status==="in")onSignedIn(r);else{auth.status=(r&&r.status)||"unavailable";if(r&&r.err){auth.err=t(r.err);ui.sheet={type:"auth"};}render();}});
</script>
</body>
